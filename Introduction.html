<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>王超伟 高级Web前端工程师\开发经理 - 简历</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --border: 214.3 31.8% 91.4%;
      --primary: 222.2 47.4% 11.2%;
      --ring: 222.2 84% 4.9%;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: hsl(var(--muted));
      color: hsl(var(--foreground));
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      background:
        linear-gradient(180deg, hsl(var(--muted)) 0%, hsl(var(--background)) 280px);
    }

    .page {
      width: min(100%, 190mm);
      min-height: 277mm;
      margin: 0 auto;
      padding: 16mm 16mm 18mm;
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      border-radius: 8px;
      box-shadow: 0 18px 48px rgb(15 23 42 / 0.08);
    }

    .resume {
      max-width: 100%;
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      color: hsl(var(--primary));
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.25;
      break-after: avoid;
      page-break-after: avoid;
    }

    h1 {
      margin-bottom: 4px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }

    h1 + p {
      margin-top: 0;
      color: hsl(var(--muted-foreground));
      line-height: 1.55;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid hsl(var(--border));
      font-size: 1.18rem;
    }

    h2::before {
      content: "";
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: hsl(var(--primary));
      flex: 0 0 auto;
    }

    h3 {
      margin-top: 16px;
      font-size: 1.08rem;
    }

    h4 {
      margin-top: 12px;
      color: hsl(var(--foreground));
      font-size: 0.95rem;
      font-weight: 600;
    }

    p {
      margin: 7px 0;
      color: hsl(var(--foreground));
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    hr {
      height: 1px;
      margin: 14px 0 18px;
      border: 0;
      background: hsl(var(--border));
    }

    hr + h2 {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    strong {
      font-weight: 700;
      color: hsl(var(--primary));
    }

    ul {
      margin: 8px 0 10px;
      padding-left: 1.2rem;
    }

    li {
      margin: 4px 0;
      padding-left: 2px;
    }

    li::marker {
      color: hsl(var(--muted-foreground));
    }

    .resume > h2:first-of-type {
      margin-top: 16px;
    }

    .resume > h2,
    .resume > h3 {
      page-break-after: avoid;
    }

    .resume > h2 + h3,
    .resume > h3 + p,
    .resume > h4 + p {
      break-before: avoid;
      page-break-before: avoid;
    }

    .resume h2,
    .resume h3,
    .resume h4,
    .resume p,
    .resume ul {
      max-width: 100%;
    }

    .resume h3 + p strong:only-child,
    .resume h4 + p strong:only-child {
      display: inline-block;
      margin-top: 2px;
    }

    .resume p:has(a[href^="mailto:"]) {
      color: hsl(var(--muted-foreground));
    }

    .resume blockquote,
    .resume pre,
    .resume table {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    @media screen and (max-width: 720px) {
      html {
        font-size: 14px;
      }

      body {
        padding: 0;
      }

      .page {
        width: 100%;
        min-height: 0;
        padding: 20px 18px 28px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      h1 {
        font-size: 1.75rem;
      }
    }

    @page {
      size: A4;
      margin: 12mm;
    }

    @media print {
      html,
      body {
        width: 210mm;
        background: #fff;
        font-size: 11.2pt;
      }

      body {
        padding: 0;
      }

      .page {
        width: auto;
        min-height: auto;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      h1 {
        font-size: 20pt;
      }

      h2 {
        margin-top: 14pt;
        padding-top: 9pt;
        font-size: 13pt;
      }

      h3 {
        margin-top: 10pt;
        font-size: 12pt;
      }

      h4 {
        margin-top: 8pt;
        font-size: 10.5pt;
        font-weight: 600;
      }

      p,
      li {
        line-height: 1.5;
      }

      p {
        margin: 4pt 0;
      }

      ul {
        margin: 5pt 0 7pt;
      }

      a {
        color: hsl(var(--foreground));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <article id="resume" class="resume" aria-live="polite">正在加载简历...</article>
  </main>

  <script>
    const markdownPath = "./Introduction.md";
    const target = document.getElementById("resume");

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function fallbackMarkdown(value) {
      const lines = value.split("\n");
      const html = [];
      let listOpen = false;

      function closeList() {
        if (listOpen) {
          html.push("</ul>");
          listOpen = false;
        }
      }

      lines.forEach((line) => {
        const text = line.trim();

        if (!text) {
          closeList();
          return;
        }

        if (text === "---") {
          closeList();
          html.push("<hr />");
          return;
        }

        const heading = text.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          closeList();
          html.push(`<h${heading[1].length}>${inlineMarkdown(heading[2])}</h${heading[1].length}>`);
          return;
        }

        if (text.startsWith("* ")) {
          if (!listOpen) {
            html.push("<ul>");
            listOpen = true;
          }
          html.push(`<li>${inlineMarkdown(text.slice(2))}</li>`);
          return;
        }

        closeList();
        html.push(`<p>${inlineMarkdown(text)}</p>`);
      });

      closeList();
      return html.join("\n");
    }

    function renderMarkdown(source) {
      if (window.marked) {
        marked.use({
          gfm: true,
          breaks: true,
          mangle: false,
          headerIds: false
        });
        target.innerHTML = marked.parse(source);
      } else {
        target.innerHTML = fallbackMarkdown(source);
      }
    }

    async function loadResume() {
      try {
        const response = await fetch(markdownPath, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        renderMarkdown(await response.text());
      } catch (error) {
        target.innerHTML = [
          "<h1>简历加载失败</h1>",
          "<p>请确认已通过本地 HTTP 服务打开本页面，并且 <strong>Introduction.md</strong> 与 <strong>简历.html</strong> 位于同一目录。</p>",
          `<p>当前读取路径：<strong>${escapeHtml(markdownPath)}</strong></p>`,
          `<p>错误信息：${escapeHtml(error.message)}</p>`
        ].join("");
      }
    }

    loadResume();
  </script>
</body>
</html>
