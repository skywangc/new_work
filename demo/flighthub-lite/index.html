<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>司空 Lite | 无人机三维态势可视化 Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="scene-panel">
        <canvas id="scene"></canvas>
        <div class="scene-toolbar" aria-label="场景工具栏">
          <button id="toggle-stream" type="button">暂停数据流</button>
          <button id="focus-fleet" type="button">聚焦机群</button>
          <button id="toggle-trails" type="button">隐藏轨迹</button>
        </div>
        <div class="scene-hint">拖拽旋转视角，滚轮缩放，点击无人机查看状态</div>
      </section>

      <aside class="ops-panel">
        <header class="ops-header">
          <p class="eyebrow">FlightHub Lite</p>
          <h1>无人机三维态势看板</h1>
          <p>模拟无人机实时位置、航线、告警和轨迹渲染，用于面试讲解三维可视化与实时数据处理。</p>
        </header>

        <section class="metric-grid" aria-label="关键指标">
          <article>
            <span>在线设备</span>
            <strong id="metric-online">0</strong>
          </article>
          <article>
            <span>平均延迟</span>
            <strong id="metric-latency">0ms</strong>
          </article>
          <article>
            <span>告警数</span>
            <strong id="metric-alerts">0</strong>
          </article>
          <article>
            <span>渲染帧率</span>
            <strong id="metric-fps">0</strong>
          </article>
        </section>

        <section class="detail-panel">
          <div class="section-title">
            <h2>当前设备</h2>
            <span id="selected-status">未选择</span>
          </div>
          <dl id="drone-detail" class="detail-list">
            <div>
              <dt>设备</dt>
              <dd>-</dd>
            </div>
            <div>
              <dt>速度</dt>
              <dd>-</dd>
            </div>
            <div>
              <dt>高度</dt>
              <dd>-</dd>
            </div>
            <div>
              <dt>电量</dt>
              <dd>-</dd>
            </div>
            <div>
              <dt>任务</dt>
              <dd>-</dd>
            </div>
          </dl>
        </section>

        <section class="fleet-panel">
          <div class="section-title">
            <h2>机群状态</h2>
            <span>实时模拟</span>
          </div>
          <div id="fleet-list" class="fleet-list"></div>
        </section>
      </aside>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
